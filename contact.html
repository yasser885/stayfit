<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | StayFit</title>
    <meta name="description" content="Rejoins StayFit : remplis le formulaire, un coach te répond sous 24 heures.">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- MENU -->
    <header class="header">
        <nav class="menu">
            <a href="programmes.html">Programmes</a>
            <a href="index.html#tarifs">Tarifs</a>
            <a href="contact.html" class="actif">Contact</a>
        </nav>

        <a href="index.html" class="logo">STAYFIT</a>

        <a href="contact.html" class="bouton bouton-clair bouton-petit header-bouton">S'inscrire</a>

        <button class="burger" aria-label="Ouvrir le menu" aria-expanded="false">
            <span></span>
            <span></span>
            <span></span>
        </button>
    </header>


    <main>

        <section class="page-titre">
            <h1>Rejoins StayFit</h1>
            <p>Remplis le formulaire, un coach te répond sous 24 heures.</p>
        </section>

        <section class="section">

            <!-- FORMULAIRE (vérifié en JavaScript) -->
            <form id="formulaire" class="formulaire" novalidate>

                <div class="champ">
                    <label for="nom">Nom complet</label>
                    <input type="text" id="nom" name="nom" placeholder="Yasser Tabya" required>
                    <span class="erreur"></span>
                </div>

                <div class="champ">
                    <label for="email">Adresse e-mail</label>
                    <input type="email" id="email" name="email" placeholder="yasser@exemple.com" required>
                    <span class="erreur"></span>
                </div>

                <div class="champ">
                    <label for="programme">Programme</label>
                    <select id="programme" name="programme" required>
                        <option value="">Choisis un programme</option>
                        <option>Perte de poids</option>
                        <option>HIIT express</option>
                        <option>Prise de muscle</option>
                        <option>Muscu à la maison</option>
                        <option>Remise en forme douce</option>
                        <option>Yoga et respiration</option>
                    </select>
                    <span class="erreur"></span>
                </div>

                <div class="champ">
                    <label for="niveau">Ton niveau</label>
                    <select id="niveau" name="niveau" required>
                        <option value="">Choisis ton niveau</option>
                        <option>Débutant</option>
                        <option>Intermédiaire</option>
                        <option>Avancé</option>
                    </select>
                    <span class="erreur"></span>
                </div>

                <div class="champ champ-large">
                    <label for="message">Un message pour ton coach (facultatif)</label>
                    <textarea id="message" name="message" rows="5" placeholder="Tes disponibilités, une blessure passée, tes questions..."></textarea>
                </div>

                <button type="submit" class="bouton bouton-large">Envoyer ma demande</button>

                <p class="message-succes" hidden>
                    Demande envoyée. Un coach te répond sous 24 heures.
                </p>

            </form>
        </section>

    </main>

    <!-- BAS DE PAGE -->
    <footer class="footer">
        <a href="index.html" class="logo">STAYFIT</a>
        <nav>
            <a href="index.html">Accueil</a>
            <a href="programmes.html">Programmes</a>
            <a href="contact.html">Contact</a>
        </nav>
        <p>© <span class="annee"></span> StayFit, projet de démonstration réalisé par Yasser Tabya.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
